<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta name="theme-color" content="#0a0a0a" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Umesh Gupta · Full-Stack Developer</title>
    <meta name="description" content="Umesh Gupta is a full-stack developer working with React, TypeScript, Node.js and MongoDB. Resume, projects, GitHub activity and contact links." />
    <meta name="author" content="Umesh Gupta" />
    <link rel="canonical" href="https://www.umeshgupta.com.np/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <meta property="og:title" content="Umesh Gupta · Full-Stack Developer" />
    <meta property="og:description" content="Resume, projects and GitHub activity of Umesh Gupta, full-stack developer." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.umeshgupta.com.np/" />
    <meta property="og:image" content="https://www.umeshgupta.com.np/image.jpg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://www.umeshgupta.com.np/image.jpg" />

    <script>
      // Dark by default; apply a saved light preference before first paint.
      // ?theme=light|dark in the URL overrides it.
      try {
        var t = new URLSearchParams(location.search).get("theme") || localStorage.getItem("theme");
        if (t === "light") document.documentElement.classList.remove("dark");
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
